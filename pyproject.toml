[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-scrub"
version = "0.1.0"
description = "Keyword-driven scraping pipeline over 4chan, Reddit, and X/Twitter, exposed as a Flask JSON API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bethe" }]
dependencies = [
    "httpx>=0.27",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.setuptools.package-data]
keyword_scrub = ["store/schema.sql"]
